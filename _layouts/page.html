---
layout: base
---
<article class="unit u-doc finish-silver" aria-labelledby="doc-title">
  <header class="doc-head">
    <h1 class="model model-lg" id="doc-title">{{ page.title }}</h1>
    {%- if page.subtitle %}
    <p class="tape tape-lg">{{ page.subtitle }}</p>
    {%- endif %}
  </header>
  <div class="doc-body">
    <div class="doc-sheet prose">
      {{ content }}
    </div>
    {% include doc-side.html %}
  </div>
</article>
